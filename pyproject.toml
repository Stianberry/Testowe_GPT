[project]
name = "social-video-studio"
version = "0.1.0"
description = "Evidence-led Polish social video production without n8n"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.10,<3",
  "playwright==1.63.0",
  "yt-dlp==2026.8.19",
  "youtube-transcript-api>=1.2,<2",
  "pillow>=11,<13",
  "pyyaml>=6,<7",
  "jsonschema>=4.20,<5",
  "python-dotenv>=1,<2",
  "requests>=2.31,<3",
  "numpy>=2,<3",
  "defusedxml==0.7.1",
]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
studio = "studio.cli:main"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["studio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
